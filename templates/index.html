<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مصاريفي</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        input, button { padding: 10px; margin: 5px; }
        li { margin: 10px 0; }
        a { color: red; text-decoration: none; margin-right: 10px; }
    </style>
</head>
<body>
    <h1>مصاريفي 💰</h1>
    
    <form method="POST">
        <input type="text" name="name" placeholder="اسم المصروف" required>
        <input type="number" step="0.01" name="amount" placeholder="المبلغ" required>
        <button type="submit">إضافة</button>
    </form>

    <h2>المصاريف:</h2>
    <ul>
        {% for expense in expenses %}
        <li>
            {{ expense.name }} - {{ expense.amount }} جنيه
            <a href="/delete/{{ loop.index0 }}">🗑️ امسح</a>
        </li>
        {% endfor %}
    </ul>

    <h3>الإجمالي: {{ total }} جنيه</h3>
</body>
</html>

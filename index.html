<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366F1">
    <title>مصاريفي 💎</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="lockScreen" class="lock-screen">
        <div class="lock-box">
            <div class="lock-icon">🔐</div>
            <h2>مصاريفي مقفول</h2>
            <input type="password" id="passwordInput" placeholder="ادخل كلمة السر">
            <button id="unlockBtn" class="btn-primary">فتح 🔓</button>
            <p id="lockMsg"></p>
        </div>
    </div>

    <div class="container" id="app" style="display:none">
        <header class="glass">
            <div class="header-top">
                <h1>💎 مصاريفي</h1>
                <div class="header-actions">
                    <button id="installBtn" class="icon-btn" style="display:none">⬇️</button>
                    <button id="lockBtn" class="icon-btn">🔒</button>
                    <button id="themeBtn" class="icon-btn">🌙</button>
                </div>
            </div>
            <div class="budget-box">
                <div class="budget-info">
                    <span>💰 ميزانية الشهر</span>
                    <input type="number" id="budgetInput" placeholder="5000">
                </div>
                <div class="progress-bar">
                    <div id="progressFill"></div>
                </div>
                <span id="budgetText">0 / 0 جنيه</span>
            </div>
        </header>

        <main>
            <form id="expense-form" class="glass">
                <h3>➕ إضافة مصروف جديد</h3>
                <div class="form-grid">
                    <div class="input-group">
                        <label for="name">📝 اسم المصروف</label>
                        <input type="text" id="name" placeholder="مثال: بنزين" required>
                    </div>
                    <div class="input-group">
                        <label for="price">💵 السعر</label>
                        <input type="number" id="price" placeholder="50" required>
                    </div>
                    <div class="input-group">
                        <label for="category">🏷️ التصنيف</label>
                        <select id="category" required>
                            <option value="🍔 أكل">🍔 أكل</option>
                            <option value="🚗 مواصلات">🚗 مواصلات</option>
                            <option value="📱 فواتير">📱 فواتير</option>
                            <option value="🎮 ترفيه">🎮 ترفيه</option>
                            <option value="💊 صحة">💊 صحة</option>
                            <option value="📦 أخرى">📦 أخرى</option>
                        </select>
                    </div>
                <button type="submit" id="addBtn" class="btn-primary">✨ إضافة المصروف</button>
            </form>

            <div class="stats-grid">
                <div class="stat-card glass">
                    <div class="stat-icon">📊</div>
                    <div class="stat-info">
                        <span class="stat-label">مصروف الشهر</span>
                        <span id="total" class="stat-value">0 جنيه</span>
                    </div>
                </div>
                <div class="stat-card glass">
                    <div class="stat-icon">📋</div>
                    <div class="stat-info">
                        <span class="stat-label">عدد المصاريف</span>
                        <span id="count" class="stat-value">0</span>
                    </div>
                </div>
            </div>

            <div class="filters glass">
                <input type="month" id="monthFilter">
                <input type="text" id="searchInput" placeholder="🔍 ابحث بالاسم...">
            </div>

            <div class="actions">
                <button id="exportBtn" class="btn-secondary">📤 تصدير JSON</button>
                <button id="clearBtn" class="btn-danger">🗑️ مسح الكل</button>
            </div>

            <div class="charts-grid">
                <div class="chart-card glass">
                    <h3>🎯 توزيع حسب التصنيف</h3>
                    <canvas id="doughnutChart"></canvas>
                </div>
                <div class="chart-card glass">
                    <h3>📈 صرف آخر 6 شهور</h3>
                    <canvas id="lineChart"></canvas>
                </div>
            </div>

            <div class="expenses-container glass">
                <h3>📑 قائمة المصاريف</h3>
                <ul id="list"></ul>
            </div>
        </main>

        <footer>
            <p>© 2026 مصاريفي 💎 Fintech Grade</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>

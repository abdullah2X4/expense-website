<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body{font-family:'Cairo',sans-serif}
      .locked{filter:blur(3px);pointer-events:none;user-select:none}
      .pro-badge{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);animation:glow 2s infinite}
      .max-badge{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);animation:glow 2s infinite}
      .fade-in{animation:fadeIn 0.6s ease-in}
      .slide-up{animation:slideUp 0.5s ease-out}
      .bounce-in{animation:bounceIn 0.8s}
       @keyframes fadeIn{from{opacity:0}to{opacity:1}}
       @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
       @keyframes bounceIn{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.05)}70%{transform:scale(0.9)}100%{transform:scale(1);opacity:1}}
       @keyframes glow{0%,100%{box-shadow:0 0 5px rgba(102,126,234,0.5)}50%{box-shadow:0 0 20px rgba(102,126,234,0.8)}}
      .card-hover{transition:all 0.3s}
      .card-hover:hover{transform:translateY(-5px);box-shadow:0 10px 25px rgba(0,0,0,0.1)}
      .vip-click{cursor:pointer;user-select:none}
    </style>
</head>

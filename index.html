<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصاريفي V6 - AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
.modal { display: none; }
.modal.active { display: flex; }
.ai-typing::after { content: '...'; animation: dots 1.5s infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app" class="hidden">
        <header class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 id="logo" class="text-2xl font-bold cursor-pointer select-none">مصاريفي V6 🤖</h1>
                <div class="flex items-center gap-4">
                    <span id="planBadge" class="bg-white/20 px-3 py-1 rounded-full text-sm"></span>
                    <button id="aiBtn" onclick="toggleAI()" class="hidden bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg transition">💬 AI VIP</button>
                    <img id="userPhoto" class="w-10 h-10 rounded-full border-2 border-white">
                    <button onclick="logout()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg transition">خروج</button>
                </div>
            </div>
        </header>
        <main class="max-w-7xl mx-auto p-4">
            <div class="grid md:grid-cols-3 gap-6 mb-6">
                <div class="bg-white rounded-xl shadow p-6">
                    <div class="text-gray-500 text-sm mb-1">إجمالي المصاريف</div>
                    <div id="totalExpense" class="text-3xl font-bold text-red-500">$0.00</div>
                </div>
                <div class="bg-white rounded-xl shadow p-6">
                    <div class="text-gray-500 text-sm mb-1">عدد المعاملات</div>
                    <div id="totalCount" class="text-3xl font-bold text-purple-600">0</div>
                </div>
                <div class="bg-white rounded-xl shadow p-6">
                    <div class="text-gray-500 text-sm mb-1">هذا الشهر</div>
                    <div id="monthTotal" class="text-3xl font-bold text-indigo-600">$0.00</div>
                </div>
            <div class="bg-white rounded-xl shadow p-6 mb-6">
                <h2 class="text-xl font-bold mb-4">إضافة مصروف جديد</h2>
                <div class="grid md:grid-cols-4 gap-4">
                    <input id="amount" type="number" placeholder="المبلغ" class="border rounded-lg px-4 py-2">
                    <input id="category" type="text" placeholder="التصنيف" class="border rounded-lg px-4 py-2">
                    <input id="description" type="text" placeholder="الوصف" class="border rounded-lg px-4 py-2">
                    <button onclick="addTransaction()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-lg transition">إضافة</button>
                </div>
                <button id="aiAnalyzeBtn" onclick="aiAnalyze()" class="hidden mt-4 bg-gradient-to-r from-purple-500 to-indigo-500 hover:from-purple-600 hover:to-indigo-600 text-white px-6 py-2 rounded-lg text-sm font-bold">🤖 حلل مصاريفي بالذكاء الاصطناعي VIP</button>
            </div>
            <div class="grid md:grid-cols-2 gap-6 mb-6">
                <div class="bg-white rounded-xl shadow p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">الرسم البياني</h2>
                        <button id="exportBtn" onclick="exportData()" class="hidden bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm">تصدير CSV</button>
                    </div>
                    <canvas id="chart"></canvas>
                </div>
                <div class="bg-white rounded-xl shadow p-6">
                    <h2 class="text-xl font-bold mb-4">آخر المعاملات</h2>
                    <div id="transactions" class="space-y-3 max-h-96 overflow-y-auto"></div>
                </div>
            </div>
        </main>
    </div>
    <div id="aiModal" class="modal fixed inset-0 bg-black/50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-2xl max-h- flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">المساعد المالي الذكي VIP 🤖💎</h2>
                <button onclick="toggleAI()" class="text-gray-500 hover:text-gray-700 text-2xl">×</button>
            </div>
            <div id="aiChat" class="flex-1 overflow-y-auto mb-4 space-y-3 bg-gray-50 p-4 rounded-lg"></div>
            <div class="flex gap-2">
                <input id="aiInput" type="text" placeholder="اسأل عن مصاريفك..." class="flex-1 border rounded-lg px-4 py-2" onkeypress="if(event.key==='Enter')sendAIMessage()">
                <button onclick="sendAIMessage()" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-lg font-bold">إرسال</button>
            </div>
        </div>
    </div>
    <div id="adminModal" class="modal fixed inset-0 bg-black/50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 w-full max-w-md">
            <h2 class="text-2xl font-bold mb-4">وضع الأدمن 🔐</h2>
            <input id="adminPass" type="password" placeholder="كلمة السر" class="w-full border rounded-lg px-4 py-2 mb-4">
            <div class="flex gap-4">
                <button onclick="checkAdmin()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-lg">دخول</button>
                <button onclick="closeAdmin()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 rounded-lg">إلغاء</button>
            </div>
            <div id="adminError" class="text-red-500 text-sm mt-3 hidden"></div>
        </div>
    </div>
    <script src="app.js"></script>
    <script>initApp();</script>
</body>
</html>

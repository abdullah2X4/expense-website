<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masarefy V6 - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 'cairo': ['Cairo', 'sans-serif'] },
                    colors: {
                        primary: '#3b82f6',
                        success: '#10b981',
                        danger: '#ef4444',
                        warning: '#f59e0b'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
       .card-hover { transition: all 0.3s ease; }
       .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-purple-50 dark:from-gray-900 dark:to-gray-800 min-h-screen">
    <nav class="bg-blue-600 dark:bg-gray-800 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-wallet text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold">Masarefy V6</h1>
                        <p id="userEmail" class="text-xs text-blue-100"></p>
                    </div>
                </div>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg transition flex items-center gap-2">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="hidden md:inline">خروج</span>
                </button>
            </div>
        </div>
    </nav>
    <div class="container mx-auto p-4 md:p-6 max-w-7xl">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 dark:text-gray-400 text-sm">إجمالي المصروفات</p>
                        <h3 id="totalExpenses" class="text-3xl font-bold text-danger mt-2">0 ج.م</h3>
                    </div>
                    <div class="w-14 h-14 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center">
                        <i class="fas fa-arrow-down text-danger text-2xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 dark:text-gray-400 text-sm">إجمالي الدخل</p>
                        <h3 id="totalIncome" class="text-3xl font-bold text-success mt-2">0 ج.م</h3>
                    </div>
                    <div class="w-14 h-14 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center">
                        <i class="fas fa-arrow-up text-success text-2xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 dark:text-gray-400 text-sm">الرصيد الحالي</p>
                        <h3 id="balance" class="text-3xl font-bold text-primary mt-2">0 ج.م</h3>
                    </div>
                    <div class="w-14 h-14 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center">
                        <i class="fas fa-wallet text-primary text-2xl"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-plus-circle text-primary"></i>
                        إضافة معاملة
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">النوع</label>
                            <select id="type" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700">
                                <option value="expense">مصروف</option>
                                <option value="income">دخل</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">المبلغ</label>
                            <input id="amount" type="number" placeholder="0" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">الفئة</label>
                            <select id="category" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700">
                                <option>طعام</option>
                                <option>مواصلات</option>
                                <option>فواتير</option>
                                <option>ترفيه</option>
                                <option>صحة</option>
                                <option>راتب</option>
                                <option>أخرى</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">ملاحظة</label>
                            <input id="note" type="text" placeholder="اختياري" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700">
                        </div>
                        <button id="addBtn" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition flex items-center justify-center gap-2">
                            <i class="fas fa-plus"></i>
                            <span>إضافة</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-2">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-list text-primary"></i>
                        آخر المعاملات
                    </h2>
                    <div id="transactionsList" class="space-y-3 max-h-96 overflow-y-auto">
                        <div class="text-center text-gray-500 py-8">
                            <i class="fas fa-inbox text-4xl mb-2"></i>
                            <p>لا توجد معاملات بعد</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-6 bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <i class="fas fa-chart-pie text-primary"></i>
                توزيع المصروفات
            </h2>
            <canvas id="expenseChart" class="max-h-80"></canvas>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصاريفي V6 🤖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
       .hidden { display: none!important; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
       .transaction-new { animation: slideIn 0.3s ease-out; }
       .ai-typing::after { content: '...'; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
       .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
       .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app" class="hidden">
        <div class="bg-gradient-to-r from-purple-600 to-blue-600 text-white p-3 sticky top-0 z-50">
            <div class="flex flex-wrap justify-between items-center gap-2">
                <div class="flex items-center gap-2">
                    <h1 id="logo" class="text-xl font-bold cursor-pointer select-none">مصاريفي V6 🤖</h1>
                    <span id="planBadge" class="text-xs bg-white/20 px-2 py-1 rounded-full"></span>
                </div>
                <div class="flex gap-2 items-center flex-wrap">
                    <button id="upgradeBtn" onclick="window.location.href='pricing.html'" class="hidden bg-yellow-400 text-black px-3 py-1 rounded-lg text-sm font-bold">ترقية 🚀</button>
                    <button id="budgetBtn" onclick="toggleBudget()" class="bg-white/20 px-3 py-1 rounded-lg text-sm">💰 الميزانية</button>
                    <button id="settingsBtn" onclick="toggleSettings()" class="bg-white/20 px-3 py-1 rounded-lg text-sm">⚙️ إعدادات</button>
                    <button id="aiBtn" onclick="toggleAI()" class="hidden bg-white/20 px-3 py-1 rounded-lg text-sm">💬 AI VIP</button>
                    <img id="userPhoto" class="w-8 h-8 rounded-full">
                    <button id="logoutBtn" onclick="logout()" class="bg-white/20 px-3 py-1 rounded-lg text-sm">خروج</button>
                </div>
            </div>
        </div>

        <div class="container mx-auto p-4 max-w-4xl">
            <div id="budgetBarContainer" class="hidden mb-4 bg-white p-4 rounded-xl shadow">
                <div class="flex justify-between items-center mb-2">
                    <span id="budgetLabel" class="font-bold">الميزانية الشهرية</span>
                    <span id="budgetText" class="text-sm"></span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div id="budgetFill" class="bg-gradient-to-r from-green-500 to-red-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white p-6 rounded-xl shadow">
                    <h3 id="totalExpenseLabel" class="text-sm text-gray-600 mb-1">إجمالي المصاريف</h3>
                    <p id="totalExpense" class="text-3xl font-bold text-purple-600">0.00 ج.م</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow">
                    <h3 id="totalCountLabel" class="text-sm text-gray-600 mb-1">عدد المعاملات</h3>
                    <p id="totalCount" class="text-3xl font-bold text-blue-600">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow">
                    <h3 id="monthTotalLabel" class="text-sm text-gray-600 mb-1">هذا الشهر</h3>
                    <p id="monthTotal" class="text-3xl font-bold text-green-600">0.00 ج.م</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow mb-6">
                <h2 id="addExpenseTitle" class="text-lg font-bold mb-4">إضافة مصروف جديد</h2>
                <div class="flex gap-2 flex-col md:flex-row">
                    <input id="amount" type="number" placeholder="المبلغ" class="flex-1 border rounded-lg px-4 py-2">
                    <input id="category" type="text" placeholder="التصنيف" class="flex-1 border rounded-lg px-4 py-2">
                    <input id="description" type="text" placeholder="الوصف" class="flex-1 border rounded-lg px-4 py-2">
                    <button id="addBtn" onclick="addTransaction()" class="bg-gradient-to-r from-purple-600 to-blue-600 text-white px-6 py-2 rounded-lg font-bold">إضافة</button>
                </div>
                <button id="aiAnalyzeBtn" onclick="aiAnalyze()" class="hidden w-full mt-3 bg-gradient-to-r from-pink-500 to-purple-600 text-white px-6 py-3 rounded-lg font-bold">🤖 حلل مصاريفي بالذكاء الاصطناعي VIP</button>
            </div>

            <div class="bg-white p-6 rounded-xl shadow mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="chartTitle" class="text-lg font-bold">الرسم البياني</h2>
                    <button id="exportBtn" onclick="exportData()" class="hidden text-sm bg-green-500 text-white px-3 py-1 rounded-lg">تصدير CSV</button>
                </div>
                <canvas id="chart"></canvas>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <h2 id="lastTransactionsTitle" class="text-lg font-bold mb-4">آخر المعاملات</h2>
                <div id="transactions" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <div id="aiModal" class="modal">
        <div class="bg-white w-full max-w-2xl m-4 rounded-xl shadow-2xl max-h-[80vh] flex flex-col">
            <div class="bg-gradient-to-r from-purple-600 to-blue-600 text-white p-4 rounded-t-xl flex justify-between items-center">
                <h2 id="aiTitle" class="text-lg font-bold">المساعد المالي الذكي VIP 🤖💎</h2>
                <button onclick="toggleAI()" class="text-2xl">&times;</button>
            </div>
            <div id="aiChat" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
            <div class="p-4 border-t">
                <div class="flex gap-2">
                    <input id="aiInput" type="text" placeholder="اسأل عن مصاريفك..." class="flex-1 border rounded-lg px-4 py-2" onkeypress="if(event.key==='Enter') sendAIMessage()">
                    <button id="sendBtn" onclick="sendAIMessage()" class="bg-purple-600 text-white px-6 py-2 rounded-lg">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md m-4">
            <h2 id="settingsTitle" class="text-xl font-bold mb-4">الإعدادات ⚙️</h2>
            <div class="space-y-4">
                <div>
                    <label id="languageLabel" class="block text-sm font-bold mb-2">اللغة</label>
                    <button id="langBtn" onclick="toggleLang()" class="w-full bg-gray-100 px-4 py-2 rounded-lg">English</button>
                </div>
                <div>
                    <label id="currencyLabel" class="block text-sm font-bold mb-2">العملة</label>
                    <button id="currencyBtn" onclick="toggleCurrency()" class="w-full bg-gray-100 px-4 py-2 rounded-lg">$ دولار أمريكي</button>
                </div>
            </div>
            <button onclick="toggleSettings()" class="w-full mt-6 bg-purple-600 text-white px-4 py-2 rounded-lg">تم</button>
        </div>
    </div>

    <div id="budgetModal" class="modal">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md m-4">
            <h2 id="budgetTitle" class="text-xl font-bold mb-4">الميزانية الشهرية 💰</h2>
            <div class="space-y-4">
                <div>
                    <label id="budgetAmountLabel" class="block text-sm font-bold mb-2">حدد ميزانيتك الشهرية</label>
                    <input id="budgetInput" type="number" placeholder="5000" class="w-full border rounded-lg px-4 py-2">
                </div>
            <div class="flex gap-2 mt-6">
                <button id="saveBudgetBtn" onclick="saveBudget()" class="flex-1 bg-purple-600 text-white px-4 py-2 rounded-lg">حفظ الميزانية</button>
                <button id="clearBudgetBtn" onclick="clearBudget()" class="flex-1 bg-gray-300 px-4 py-2 rounded-lg">إلغاء الميزانية</button>
            </div>
        </div>
    </div>

    <div id="adminModal" class="modal">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md m-4">
            <h2 id="adminTitle" class="text-xl font-bold mb-4">وضع الأدمن 🔐</h2>
            <input id="adminPass" type="password" placeholder="كلمة السر" class="w-full border rounded-lg px-4 py-2 mb-4">
            <div class="flex gap-2">
                <button id="adminEnterBtn" onclick="checkAdmin()" class="flex-1 bg-purple-600 text-white px-4 py-2 rounded-lg">دخول</button>
                <button id="adminCancelBtn" onclick="closeAdmin()" class="flex-1 bg-gray-300 px-4 py-2 rounded-lg">إلغاء</button>
            </div>
            <p id="adminError" class="text-red-500 text-sm mt-2 hidden">كلمة سر خاطئة</p>
        </div>
    </div>

    <script src="app.js"></script>
    <script>initApp();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masarefy V6 - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }

       .modal { display: none; opacity: 0; transition: opacity 0.3s ease; }
      .modal.active { display: flex; opacity: 1; }
      .modal > div { transform: scale(0.9); transition: transform 0.3s ease; }
      .modal.active > div { transform: scale(1); }

      .ai-typing::after { content: '...'; animation: dots 1.5s infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }

      .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

      .transaction-new { animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

        button:active { transform: scale(0.97); }
        button { transition: all 0.2s; }

       .header-glow { animation: glow 3s ease-in-out infinite; }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); } 50% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.5); } }
        
        /* شريط الميزانية */
        .budget-bar { height: 8px; background: #e5e7eb; border-radius: 9999px; overflow: hidden; }
        .budget-fill { height: 100%; background: linear-gradient(to right, #10b981, #f59e0b, #ef4444); transition: width 0.5s ease; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- الهيدر -->
    <header class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-lg header-glow">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <h1 id="logo" class="text-2xl md:text-3xl font-extrabold cursor-pointer select-none">مصاريفي V6 🤖</h1>
                <span id="planBadge" class="bg-white/20 px-3 py-1 rounded-full text-xs md:text-sm"></span>
                <button id="upgradeBtn" onclick="window.location.href='pricing.html'" class="hidden bg-yellow-400 hover:bg-yellow-500 text-gray-800 px-3 py-1 rounded-lg text-sm font-bold transition">ترقية 🚀</button>
            </div>
            <div class="flex items-center gap-2">
                <button id="budgetBtn" onclick="toggleBudget()" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg text-sm font-bold transition">💰 الميزانية</button>
                <button id="settingsBtn" onclick="toggleSettings()" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg text-sm font-bold transition">⚙️ إعدادات</button>
                <button id="aiBtn" onclick="toggleAI()" class="hidden bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg text-sm font-bold transition">💬 AI VIP</button>
                <img id="userPhoto" class="w-10 h-10 rounded-full border-2 border-white" src="" alt="User">
                <button id="logoutBtn" onclick="logout()" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg text-sm font-bold transition">خروج</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main id="app" class="hidden max-w-7xl mx-auto p-4 fade-in">

        <!-- شريط الميزانية -->
        <div id="budgetBarContainer" class="hidden bg-white rounded-xl shadow p-4 mb-6 fade-in">
            <div class="flex justify-between items-center mb-2">
                <span id="budgetLabel" class="text-sm font-bold text-gray-700">الميزانية الشهرية</span>
                <span id="budgetText" class="text-sm font-bold text-purple-600">0 / 0</span>
            </div>
            <div class="budget-bar">
                <div id="budgetFill" class="budget-fill" style="width: 0%"></div>
            </div>
        </div>

        <!-- كروت الإحصائيات -->
        <div class="grid md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow p-6 fade-in">
                <h3 id="totalExpenseLabel" class="text-gray-500 text-sm mb-2">إجمالي المصاريف</h3>
                <p id="totalExpense" class="text-3xl font-extrabold text-purple-600">0</p>
            </div>
            <div class="bg-white rounded-xl shadow p-6 fade-in">
                <h3 id="totalCountLabel" class="text-gray-500 text-sm mb-2">عدد المعاملات</h3>
                <p id="totalCount" class="text-3xl font-extrabold text-indigo-600">0</p>
            </div>
            <div class="bg-white rounded-xl shadow p-6 fade-in">
                <h3 id="monthTotalLabel" class="text-gray-500 text-sm mb-2">هذا الشهر</h3>
                <p id="monthTotal" class="text-3xl font-extrabold text-blue-600">0</p>
            </div>
        </div>

        <!-- إضافة مصروف -->
        <div class="bg-white rounded-xl shadow p-6 mb-8 fade-in">
            <h2 id="addExpenseTitle" class="text-xl font-bold mb-4">إضافة مصروف جديد</h2>
            <div class="grid md:grid-cols-4 gap-4">
                <input id="amount" type="number" placeholder="المبلغ" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none">
                <input id="category" type="text" placeholder="التصنيف" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none">
                <input id="description" type="text" placeholder="الوصف" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none">
                <button id="addBtn" onclick="addTransaction()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold py-2 rounded-lg transition shadow-lg">إضافة</button>
            </div>
            <button id="aiAnalyzeBtn" onclick="aiAnalyze()" class="hidden mt-4 w-full bg-gradient-to-r from-yellow-400 to-orange-400 hover:from-yellow-500 hover:to-orange-500 text-gray-800 font-bold py-3 rounded-lg transition shadow-lg">🤖 حلل مصاريفي بالذكاء الاصطناعي VIP</button>
        </div>

        <!-- الرسم البياني -->
        <div class="grid md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow p-6 fade-in">
                <h2 id="chartTitle" class="text-xl font-bold mb-4">الرسم البياني</h2>
                <canvas id="chart"></canvas>
            </div>
            <div class="bg-white rounded-xl shadow p-6 fade-in">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="lastTransactionsTitle" class="text-xl font-bold">آخر المعاملات</h2>
                    <button id="exportBtn" onclick="exportData()" class="hidden bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition">تصدير CSV</button>
                </div>
                <div id="transactions" class="space-y-2 max-h-96 overflow-y-auto"></div>
            </div>
        </div>

    </main>

    <!-- مودال الإعدادات -->
    <div id="settingsModal" class="modal fixed inset-0 bg-black/50 items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 id="settingsTitle" class="text-2xl font-bold">الإعدادات ⚙️</h2>
                <button onclick="toggleSettings()" class="text-gray-500 hover:text-gray-700 text-2xl">✕</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label id="languageLabel" class="block text-sm font-bold text-gray-700 mb-2">اللغة</label>
                    <button onclick="toggleLang()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition">
                        <span id="langBtn">English</span>
                    </button>
                </div>
                
                <div>
                    <label id="currencyLabel" class="block text-sm font-bold text-gray-700 mb-2">العملة</label>
                    <button onclick="toggleCurrency()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">
                        <span id="currencyBtn">$ دولار أمريكي</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال الميزانية -->
    <div id="budgetModal" class="modal fixed inset-0 bg-black/50 items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 id="budgetTitle" class="text-2xl font-bold">الميزانية الشهرية 💰</h2>
                <button onclick="toggleBudget()" class="text-gray-500 hover:text-gray-700 text-2xl">✕</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label id="budgetAmountLabel" class="block text-sm font-bold text-gray-700 mb-2">حدد ميزانيتك الشهرية</label>
                    <input id="budgetInput" type="number" placeholder="5000" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>
                
                <button onclick="saveBudget()" id="saveBudgetBtn" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold py-3 rounded-lg transition shadow-lg">حفظ الميزانية</button>
                
                <button onclick="clearBudget()" id="clearBudgetBtn" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 rounded-lg transition">إلغاء الميزانية</button>
            </div>
        </div>
    </div>

    <!-- مودال AI -->
    <div id="aiModal" class="modal fixed inset-0 bg-black/50 items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h- flex flex-col">
            <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-6 rounded-t-2xl flex justify-between items-center">
                <h2 id="aiTitle" class="text-2xl font-bold">المساعد المالي الذكي VIP 🤖💎</h2>
                <button onclick="toggleAI()" class="text-white hover:text-gray-200 text-2xl">✕</button>
            </div>
            <div id="aiChat" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
            <div class="p-4 border-t">
                <div class="flex gap-2">
                    <input id="aiInput" type="text" placeholder="اسأل عن مصاريفك..." class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none">
                    <button id="sendBtn" onclick="sendAIMessage()" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-lg font-bold transition">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال الأدمن -->
    <div id="adminModal" class="modal fixed inset-0 bg-black/50 items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
            <h2 id="adminTitle" class="text-2xl font-bold mb-4">وضع الأدمن 🔐</h2>
            <input id="adminPass" type="password" placeholder="كلمة السر" class="w-full px-4 py-2 border rounded-lg mb-4 focus:ring-2 focus:ring-purple-500 focus:outline-none">
            <div id="adminError" class="hidden text-red-500 text-sm mb-4"></div>
            <div class="flex gap-2">
                <button id="adminEnterBtn" onclick="checkAdmin()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-lg transition">دخول</button>
                <button id="adminCancelBtn" onclick="closeAdmin()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 rounded-lg transition">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>initApp();</script>
</body>
</html>

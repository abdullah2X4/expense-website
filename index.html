<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Masarefy - الرئيسية</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-100 p-4 pb-24">
    
    <!-- الهيدر -->
    <div class="flex justify-between items-center mb-6 animate-fade-up">
        <div>
            <h1 id="adminTrigger" class="text-3xl font-bold text-cyan-400 select-none">Masarefy</h1>
            <p id="userName" class="text-sm text-slate-400"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="window.location.href='pricing.html'" id="vipBtn" class="px-4 py-3 rounded-2xl font-bold bg-slate-800 btn-active">⭐️</button>
            <button onclick="showSettings()" class="p-3 rounded-2xl bg-slate-800 btn-active">⚙️</button>
        </div>
    </div>

    <div id="vipBadge" class="hidden vip-badge text-black p-3 rounded-2xl text-center mb-4 font-bold animate-scale"></div>
    
    <!-- الرصيد -->
    <div class="glass p-6 rounded-3xl mb-4 shadow-xl animate-fade-up">
        <p class="text-slate-400 text-sm mb-1">رصيدك الحالي</p>
        <p id="balance" class="text-5xl font-bold text-emerald-400">0.00 ج.م</p>
        <p id="limitText" class="text-xs text-slate-500 mt-3"></p>
    </div>

    <!-- الميزانية الشهرية -->
    <div class="glass p-5 rounded-3xl mb-6 animate-fade-up">
        <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-2">
                <span class="text-2xl">📊</span>
                <p class="text-slate-300 font-semibold">ميزانية الشهر</p>
            </div>
            <button onclick="setBudget()" class="text-xs bg-cyan-600 px-4 py-2 rounded-xl btn-active">تعديل</button>
        </div>
        <div class="w-full bg-slate-700 rounded-full h-2.5 mb-3 overflow-hidden">
            <div id="budgetBar" class="progress-bar bg-emerald-500 h-2.5 rounded-full" style="width: 0%"></div>
        </div>
        <div class="flex justify-between text-xs text-slate-400">
            <span id="spentText">صرفت: 0 ج.م</span>
            <span id="budgetText">الميزانية: 0 ج.م</span>
        </div>
    </div>

    <!-- الأزرار -->
    <div class="grid grid-cols-2 gap-3 mb-6 animate-fade-up">
        <button onclick="showAddModal('دخل')" class="bg-emerald-600 p-5 rounded-2xl font-bold btn-active flex flex-col items-center gap-2">
            <span class="text-3xl">💵</span>
            <span>+ دخل</span>
        </button>
        <button onclick="showAddModal('مصروف')" class="bg-rose-600 p-5 rounded-2xl font-bold btn-active flex flex-col items-center gap-2">
            <span class="text-3xl">💸</span>
            <span>- مصروف</span>
        </button>
    </div>

    <button onclick="askAI()" class="w-full bg-violet-600 p-4 rounded-2xl font-bold mb-6 btn-active animate-fade-up flex items-center justify-center gap-2">
        <span class="text-2xl">🤖</span>
        <span>اسأل المساعد الذكي</span>
    </button>

    <!-- السجل -->
    <div class="flex justify-between items-center mb-4 animate-fade-up">
        <h2 class="text-xl font-bold">السجل</h2>
        <button onclick="clearAll()" class="text-xs bg-red-900 px-4 py-2 rounded-xl btn-active flex items-center gap-1">
            <span>🗑️</span>
            <span>مسح الكل</span>
        </button>
    </div>
    <div id="history" class="space-y-3"></div>

    <!-- Modals -->
    <div id="addModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm p-4 z-50 flex items-end">
        <div class="glass w-full max-w-md mx-auto rounded-t-3xl p-6 bottom-sheet" id="addModalSheet">
            <div class="w-12 h-1 bg-slate-600 rounded-full mx-auto mb-6"></div>
            <h2 id="modalTitle" class="text-2xl font-bold mb-6 text-center">إضافة مصروف</h2>
            <input id="txName" placeholder="اسم المصروف - مثلا: كشري" class="w-full input-dark p-4 rounded-2xl mb-3">
            <input id="txAmount" type="number" placeholder="المبلغ" class="w-full input-dark p-4 rounded-2xl mb-3">
            <select id="txCategory" class="w-full input-dark p-4 rounded-2xl mb-3"></select>
            <button onclick="showAddCategory()" class="w-full text-sm text-cyan-400 mb-6 py-2">+ إضافة فئة جديدة</button>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="saveTransaction()" class="bg-emerald-600 p-4 rounded-2xl font-bold btn-active">حفظ</button>
                <button onclick="closeAddModal()" class="bg-slate-700 p-4 rounded-2xl btn-active">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="categoryModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm p-4 z-50 flex items-end">
        <div class="glass w-full max-w-md mx-auto rounded-t-3xl p-6 bottom-sheet" id="categoryModalSheet">
            <div class="w-12 h-1 bg-slate-600 rounded-full mx-auto mb-6"></div>
            <h2 class="text-2xl font-bold mb-6 text-center">فئة جديدة</h2>
            <input id="newCategoryName" placeholder="اسم الفئة - مثلا: قهوة" class="w-full input-dark p-4 rounded-2xl mb-3">
            <input id="newCategoryIcon" placeholder="أيقونة - مثلا: ☕️" maxlength="2" class="w-full input-dark p-4 rounded-2xl mb-6 text-center text-3xl">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="saveCategory()" class="bg-emerald-600 p-4 rounded-2xl font-bold btn-active">حفظ</button>
                <button onclick="closeCategoryModal()" class="bg-slate-700 p-4 rounded-2xl btn-active">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm p-4 z-50 flex items-end">
        <div class="glass w-full max-w-md mx-auto rounded-t-3xl p-6 bottom-sheet" id="settingsModalSheet">
            <div class="w-12 h-1 bg-slate-600 rounded-full mx-auto mb-6"></div>
            <h2 class="text-2xl font-bold mb-6 text-center">الإعدادات ⚙️</h2>
            <div class="space-y-4 mb-6">
                <div class="bg-slate-800/50 p-4 rounded-2xl">
                    <p class="text-sm text-slate-400 mb-2">الاسم</p>
                    <input id="settingsName" placeholder="اسمك" class="w-full input-dark p-3 rounded-xl">
                </div>
                <div class="bg-slate-800/50 p-4 rounded-2xl">
                    <p class="text-sm text-slate-400 mb-2">الميزانية الشهرية</p>
                    <input id="settingsBudget" type="number" placeholder="0" class="w-full input-dark p-3 rounded-xl">
                </div>
                <button onclick="saveSettings()" class="w-full bg-cyan-600 p-4 rounded-2xl font-bold btn-active">حفظ الإعدادات</button>
                <button onclick="signOut()" class="w-full bg-red-600 p-4 rounded-2xl font-bold btn-active">تسجيل خروج</button>
            </div>
            <button onclick="closeSettings()" class="w-full bg-slate-700 p-4 rounded-2xl btn-active">إغلاق</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>

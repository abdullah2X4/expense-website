<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366F1">
    <title>مصاريفي VIP 👑</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div id="lockScreen" class="lock-screen">
        <div class="lock-box">
            <div class="lock-icon">👑</div>
            <h2>مصاريفي VIP</h2>
            <input type="password" id="passwordInput" placeholder="كلمة السر">
            <button id="unlockBtn" class="btn-primary">فتح 🔓</button>
            <p id="lockMsg"></p>
        </div>
    </div>

    <div class="container" id="app" style="display:none">
        <header class="glass">
            <div class="header-top">
                <div class="logo">
                    <h1>💎 مصاريفي <span class="vip-badge">VIP</span></h1>
                </div>
                <div class="header-actions">
                    <div class="theme-picker">
                        <button class="theme-dot" data-theme="purple" style="background:#6366F1"></button>
                        <button class="theme-dot" data-theme="blue" style="background:#3B82F6"></button>
                        <button class="theme-dot" data-theme="green" style="background:#10B981"></button>
                        <button class="theme-dot" data-theme="gold" style="background:#F59E0B"></button>
                    </div>
                    <button id="cloudBtn" class="icon-btn">☁️</button>
                    <button id="lockBtn" class="icon-btn">🔒</button>
                    <button id="themeBtn" class="icon-btn">🌙</button>
                </div>
            </div>
            <div class="budget-box">
                <div class="budget-info">
                    <span>💰 ميزانية الشهر</span>
                    <input type="number" id="budgetInput" placeholder="5000">
                </div>
                <div class="progress-bar">
                    <div id="progressFill"></div>
                </div>
                <div class="budget-footer">
                    <span id="budgetText">0 / 0 جنيه</span>
                    <span id="budgetAlert"></span>
                </div>
            </div>
        </header>

        <main>
            <form id="expense-form" class="glass">
                <h3>➕ إضافة مصروف جديد</h3>
                <div class="form-grid">
                    <div class="input-group">
                        <label for="name">📝 اسم المصروف</label>
                        <input type="text" id="name" placeholder="مثال: بنزين" required>
                    </div>
                    <div class="input-group">
                        <label for="price">💵 السعر</label>
                        <input type="number" id="price" placeholder="50" required>
                    </div>
                    <div class="input-group">
                        <label for="category">🏷️ التصنيف</label>
                        <select id="category" required>
                            <option value="🍔 أكل">🍔 أكل</option>
                            <option value="🚗 مواصلات">🚗 مواصلات</option>
                            <option value="📱 فواتير">📱 فواتير</option>
                            <option value="🎮 ترفيه">🎮 ترفيه</option>
                            <option value="💊 صحة">💊 صحة</option>
                            <option value="🛍️ تسوق">🛍️ تسوق</option>
                            <option value="📦 أخرى">📦 أخرى</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="payment">💳 طريقة الدفع</label>
                        <select id="payment" required>
                            <option value="💵 كاش">💵 كاش</option>
                            <option value="💳 فيزا">💳 فيزا</option>
                            <option value="📱 محفظة">📱 محفظة إلكترونية</option>
                            <option value="🔄 تقسيط">🔄 تقسيط</option>
                            <option value="🏦 تحويل بنكي">🏦 تحويل بنكي</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="receipt">📸 صورة الفاتورة VIP</label>
                        <input type="file" id="receipt" accept="image/*">
                    </div>
                </div>
                <button type="button" id="addBtn" class="btn-primary">✨ إضافة المصروف</button>
            </form>

            <div class="stats-grid">
                <div class="stat-card glass">
                    <div class="stat-icon">📊</div>
                    <div class="stat-info">
                        <span class="stat-label">مصروف الشهر</span>
                        <span id="total" class="stat-value">0 جنيه</span>
                    </div>
                </div>
                <div class="stat-card glass">
                    <div class="stat-icon">📋</div>
                    <div class="stat-info">
                        <span class="stat-label">عدد المصاريف</span>
                        <span id="count" class="stat-value">0</span>
                    </div>
                </div>
                <div class="stat-card glass">
                    <div class="stat-icon">💸</div>
                    <div class="stat-info">
                        <span class="stat-label">متوسط يومي</span>
                        <span id="avgDaily" class="stat-value">0 جنيه</span>
                    </div>
                </div>
            </div>

            <div class="filters glass">
                <input type="month" id="monthFilter">
                <input type="text" id="searchInput" placeholder="🔍 ابحث بالاسم...">
            </div>

            <div class="actions">
                <button id="exportExcelBtn" class="btn-secondary">📊 Excel VIP</button>
                <button id="exportPdfBtn" class="btn-secondary">📄 PDF VIP</button>
                <button id="exportJsonBtn" class="btn-secondary">📤 JSON</button>
                <button id="clearBtn" class="btn-danger">🗑️ مسح الكل</button>
            </div>

            <div class="charts-grid">
                <div class="chart-card glass">
                    <h3>🎯 توزيع حسب التصنيف</h3>
                    <canvas id="doughnutChart"></canvas>
                </div>
                <div class="chart-card glass">
                    <h3>💳 توزيع حسب الدفع</h3>
                    <canvas id="paymentChart"></canvas>
                </div>
                <div class="chart-card glass" style="grid-column: 1 / -1;">
                    <h3>📈 صرف آخر 6 شهور</h3>
                    <canvas id="lineChart"></canvas>
                </div>
            </div>

            <div class="expenses-container glass">
                <h3>📑 قائمة المصاريف</h3>
                <ul id="list"></ul>
            </div>
        </main>

        <footer>
            <p>© 2026 مصاريفي VIP 👑 | Fintech Grade</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masarefy V6 Pro - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 'cairo': ['Cairo', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-in-out',
                        'slide-up': 'slideUp 0.5s ease-out'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .bg-animated {
            background: linear-gradient(-45deg, #3b82f6, #8b5cf6, #06b6d4, #10b981, #f59e0b);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-animated min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white/95 dark:bg-gray-800/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 w-full max-w-md animate-slide-up">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg animate-pulse">
                <i class="fas fa-wallet text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-black text-gray-800 dark:text-white">Masarefy V6 <span class="text-blue-500">Pro</span></h1>
            <p class="text-gray-500 dark:text-gray-400 mt-2">مدير مصاريفك الذكي بالـ AI</p>
        </div>

        <div class="absolute top-4 left-4">
            <select id="langSelect" onchange="setLang(this.value)" class="px-3 py-1 rounded-lg bg-gray-100 dark:bg-gray-700 text-sm">
                <option value="ar">🇪🇬 العربية</option>
                <option value="en">🇺🇸 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="es">🇪🇸 Español</option>
            </select>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">البريد الإلكتروني</label>
                <input 
                    id="email" 
                    type="email" 
                    placeholder="example@email.com"
                    class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white transition"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">كلمة المرور</label>
                <input 
                    id="password" 
                    type="password" 
                    placeholder="••••••••"
                    class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white transition"
                >
            </div>

            <button 
                id="loginBtn" 
                class="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-bold py-3 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg"
            >
                <i class="fas fa-sign-in-alt"></i>
                <span>تسجيل الدخول</span>
            </button>
        </div>

        <div class="flex items-center my-6">
            <div class="flex-1 border-t border-gray-300 dark:border-gray-600"></div>
            <span class="px-4 text-gray-500 dark:text-gray-400 text-sm">أو</span>
            <div class="flex-1 border-t border-gray-300 dark:border-gray-600"></div>
        </div>

        <button 
            id="googleBtn" 
            class="w-full bg-white hover:bg-gray-50 text-gray-800 font-bold py-3 rounded-xl border border-gray-300 transition duration-200 flex items-center justify-center gap-3 shadow-md"
        >
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
            <span>تسجيل الدخول بـ Google</span>
        </button>

        <div class="mt-6 text-center text-xs text-gray-400">
            <p>V6.0 Pro - AI Powered</p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script>
        function setLang(lang) {
            localStorage.setItem('lang', lang);
            location.reload();
        }
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    </script>
</body>
</html>

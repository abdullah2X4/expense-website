<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Wallet - تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Cairo', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
    .gradient-text { background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-active:active { transform: scale(0.95); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.5s ease; }
  </style>
</head>
<body class="text-white flex items-center justify-center p-6">
  <div class="glass p-8 rounded-3xl w-full max-w-md animate-fade-in">
    <div class="text-center mb-8">
      <div class="text-6xl mb-4">💰</div>
      <h1 class="text-3xl font-bold gradient-text mb-2">Smart Wallet</h1>
      <p class="text-slate-400">إدارة أموالك بذكاء</p>
    </div>

    <!-- تسجيل دخول بجوجل -->
    <button id="googleLoginBtn" class="w-full bg-white text-slate-900 py-4 rounded-2xl font-bold flex items-center justify-center gap-3 btn-active mb-6">
      <span class="text-2xl">🔐</span> تسجيل الدخول بجوجل
    </button>

    <div class="flex items-center gap-4 mb-6">
      <div class="flex-1 h-px bg-slate-700"></div>
      <span class="text-slate-500 text-sm">أو</span>
      <div class="flex-1 h-px bg-slate-700"></div>
    </div>

    <!-- تسجيل دخول بالإيميل -->
    <div class="space-y-4">
      <div>
        <label class="text-sm text-slate-400">البريد الإلكتروني</label>
        <input id="emailInput" type="email" class="w-full mt-2 bg-slate-800 p-3 rounded-xl" placeholder="example@gmail.com">
      </div>
      <div>
        <label class="text-sm text-slate-400">كلمة المرور</label>
        <input id="passwordInput" type="password" class="w-full mt-2 bg-slate-800 p-3 rounded-xl" placeholder="••••••••">
      </div>
      
      <button id="emailLoginBtn" class="w-full bg-emerald-600 py-4 rounded-2xl font-bold btn-active">
        تسجيل الدخول
      </button>
      
      <button id="emailSignupBtn" class="w-full bg-slate-700 py-4 rounded-2xl font-bold btn-active">
        إنشاء حساب جديد
      </button>
    </div>

    <p class="text-xs text-slate-500 text-center mt-6">بالتسجيل، أنت توافق على الشروط والأحكام</p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
